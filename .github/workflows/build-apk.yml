name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep the app's page in sync with index.html
        run: cp index.html app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: |
          VC=${{ github.run_number }}
          VN="2.$VC"
          echo "VN=$VN" >> $GITHUB_ENV
          sed -i "s/versionCode 1$/versionCode $VC/; s/versionName '1.0'/versionName '$VN'/" app/build.gradle
          sed -i "s/<span>Version 2.0<\/span>/<span>Version $VN<\/span>/" app/src/main/assets/index.html
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AntibioticTimeout.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AntibioticTimeout-apk
          path: AntibioticTimeout.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: Antibiotic Time-out v${{ env.VN }}
          make_latest: true
          files: AntibioticTimeout.apk
