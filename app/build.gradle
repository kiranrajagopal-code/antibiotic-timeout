plugins { id 'com.android.application' }

android {
    namespace 'com.kiranrajagopal.abxtimeout'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kiranrajagopal.abxtimeout'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('abx.keystore')
            storePassword 'abxtimeout'
            keyAlias 'abx'
            keyPassword 'abxtimeout'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
